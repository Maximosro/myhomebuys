<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome to myhomebuys</h1>
    <p class="text-gray-500">Your personal home management platform</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <a th:href="@{/receipts}"
       class="block p-6 bg-white rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
      <div class="text-2xl mb-2">🧾</div>
      <h2 class="text-lg font-semibold text-gray-900 mb-1">Receipts</h2>
      <p class="text-sm text-gray-500">Upload, search and manage your shopping receipts</p>
    </a>

    <div class="block p-6 bg-white rounded-lg shadow-sm border border-gray-200 opacity-50 cursor-not-allowed">
      <div class="text-2xl mb-2">📦</div>
      <h2 class="text-lg font-semibold text-gray-900 mb-1">Pantry</h2>
      <p class="text-sm text-gray-500">Coming soon</p>
    </div>

    <div class="block p-6 bg-white rounded-lg shadow-sm border border-gray-200 opacity-50 cursor-not-allowed">
      <div class="text-2xl mb-2">📊</div>
      <h2 class="text-lg font-semibold text-gray-900 mb-1">Analytics</h2>
      <p class="text-sm text-gray-500">Coming soon</p>
    </div>
  </div>
</th:block>
</html>
