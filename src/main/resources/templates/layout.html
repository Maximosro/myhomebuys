<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myhomebuys</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else if (saved === 'dark' || prefersDark) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }

    .htmx-indicator { opacity: 0; transition: opacity .2s ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }

    .htmx-swapping { opacity: 0; transition: opacity 0.3s ease-out; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.35s ease-out both; }
    .animate-fade-in-d-1 { animation-delay: 0.05s; }
    .animate-fade-in-d-2 { animation-delay: 0.1s; }

    @keyframes slide-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.3s ease-out both; }

    @keyframes modal-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-modal-in { animation: modal-in 0.15s ease-out both; }

    .stat-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .stat-card:hover { transform: translateY(-2px); }

    .toast-success { animation: slide-up 0.3s ease-out; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <nav th:replace="~{fragments/menu :: menu(activeModule=${activeModule})}"></nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <th:block th:if="${successMessage}">
      <div class="toast-success fixed top-4 right-4 z-50 max-w-sm p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200 rounded-xl shadow-lg flex items-center gap-3"
           role="alert"
           id="success-toast">
        <span th:insert="~{fragments/icons :: check}" class="w-5 h-5 text-emerald-600 dark:text-emerald-400 flex-shrink-0"></span>
        <span th:text="${successMessage}" class="text-sm font-medium"></span>
        <button onclick="this.closest('[role=alert]').remove()"
                class="ml-auto text-emerald-600 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-200 flex-shrink-0">
          <span th:insert="~{fragments/icons :: close}" class="w-4 h-4"></span>
        </button>
        <script>
          (function() {
            var el = document.currentScript.parentElement;
            setTimeout(function() { if (el && el.parentElement) el.remove(); }, 4000);
          })();
        </script>
      </div>
    </th:block>

    <div class="animate-fade-in">
      <th:block th:replace="~{::content}" />
    </div>
  </main>

  <!-- Confirm modal -->
  <div id="confirm-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm"
       onclick="closeConfirmModal(false)">
    <div class="animate-modal-in bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4"
         onclick="event.stopPropagation()">
      <div class="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-600 dark:text-red-400 mb-4 mx-auto">
        <span th:insert="~{fragments/icons :: trash}" class="w-5 h-5"></span>
      </div>
      <p id="confirm-message" class="text-sm text-gray-600 dark:text-gray-300 text-center mb-6">Delete this receipt?</p>
      <div class="flex gap-3">
        <button onclick="closeConfirmModal(false)"
                class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
          Cancel
        </button>
        <button onclick="closeConfirmModal(true)" id="confirm-btn"
                class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 transition-colors">
          Delete
        </button>
      </div>
    </div>
  </div>

  <script>
    let confirmResolve = null;

    function appConfirm(message, type) {
      return new Promise(function(resolve) {
        confirmResolve = resolve;
        document.getElementById('confirm-message').textContent = message;
        const btn = document.getElementById('confirm-btn');
        const iconContainer = document.querySelector('#confirm-overlay .rounded-xl');
        if (type === 'danger') {
          btn.className = 'flex-1 px-4 py-2.5 text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 transition-colors';
          btn.textContent = 'Delete';
          iconContainer.className = 'w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-600 dark:text-red-400 mb-4 mx-auto';
        } else {
          btn.className = 'flex-1 px-4 py-2.5 text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition-colors';
          btn.textContent = 'Confirm';
          iconContainer.className = 'w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-4 mx-auto';
        }
        document.getElementById('confirm-overlay').classList.remove('hidden');
        document.getElementById('confirm-overlay').classList.add('flex');
      });
    }

    function closeConfirmModal(result) {
      document.getElementById('confirm-overlay').classList.add('hidden');
      document.getElementById('confirm-overlay').classList.remove('flex');
      if (confirmResolve) {
        confirmResolve(!!result);
        confirmResolve = null;
      }
    }



  </script>
</body>
</html>
