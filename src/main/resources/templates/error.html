<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="flex flex-col items-center justify-center py-20 text-center">
    <div class="w-16 h-16 rounded-2xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-500 dark:text-red-400 mb-6">
      <span th:insert="~{fragments/icons :: close}" class="w-8 h-8"></span>
    </div>
    <h1 class="text-5xl font-bold text-gray-300 dark:text-gray-700 mb-3" th:text="${status}">404</h1>
    <p class="text-base text-gray-500 dark:text-gray-400 mb-8" th:text="${message}">Page not found</p>
    <a th:href="@{/}"
       class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
      <span th:insert="~{fragments/icons :: home}" class="w-4 h-4"></span>
      Back to home
    </a>
  </div>
</th:block>
</html>
