<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="toast">
  <div class="fixed top-4 right-4 z-50 max-w-sm p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg shadow-lg"
       role="alert"
       _="on load wait 4s then remove me">
    <div class="flex items-center justify-between">
      <span th:text="${message}">Error</span>
      <button class="ml-4 text-red-700 hover:text-red-900 font-bold"
              _="on click remove the closest parent div">x</button>
    </div>
  </div>
</th:block>
</html>
