<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="menu(activeModule)">
  <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 transition-colors duration-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <a th:href="@{/}" class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2 shrink-0">
          <span class="w-6 h-6 bg-indigo-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">m</span>
          myhomebuys
        </a>

        <!-- Desktop nav -->
        <div class="hidden md:flex items-center gap-1" sec:authorize="isAuthenticated()">
          <a th:href="@{/}"
             th:classappend="${activeModule == 'home'} ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
             class="px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
            <span th:insert="~{fragments/icons :: home}" class="w-4 h-4"></span>
            Home
          </a>
          <a th:href="@{/receipts}"
             th:classappend="${activeModule == 'receipts'} ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
             class="px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
            <span th:insert="~{fragments/icons :: receipts}" class="w-4 h-4"></span>
            Receipts
          </a>
        </div>

        <!-- Right side: user + theme toggle + hamburger -->
        <div class="flex items-center gap-2">
          <div sec:authorize="isAuthenticated()" class="hidden md:flex items-center gap-2">
            <span class="text-xs text-gray-500 dark:text-gray-400" sec:authentication="name"></span>
            <a th:href="@{/auth/logout}"
               class="px-2.5 py-1.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">
              Sign out
            </a>
          </div>
          <button id="theme-toggle"
                  class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                  onclick="toggleTheme()"
                  aria-label="Toggle theme">
            <span id="theme-icon-sun" class="hidden"><span th:insert="~{fragments/icons :: sun}" class="w-5 h-5"></span></span>
            <span id="theme-icon-moon"><span th:insert="~{fragments/icons :: moon}" class="w-5 h-5"></span></span>
          </button>
          <button id="menu-toggle"
                  class="md:hidden p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                  onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                  aria-label="Toggle menu">
            <span th:insert="~{fragments/icons :: bars3}" class="w-5 h-5"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 transition-colors duration-200">
      <div class="px-4 py-2 space-y-1">
        <a th:href="@{/}"
           th:classappend="${activeModule == 'home'} ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
           class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
           onclick="document.getElementById('mobile-menu').classList.add('hidden')">
          <span th:insert="~{fragments/icons :: home}" class="w-4 h-4"></span>
          Home
        </a>
        <a th:href="@{/receipts}"
           th:classappend="${activeModule == 'receipts'} ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
           class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
           onclick="document.getElementById('mobile-menu').classList.add('hidden')">
          <span th:insert="~{fragments/icons :: receipts}" class="w-4 h-4"></span>
          Receipts
        </a>
      </div>
    </div>
  </nav>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    (function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sunIcon = document.getElementById('theme-icon-sun');
      const moonIcon = document.getElementById('theme-icon-moon');
      if (sunIcon && moonIcon) {
        sunIcon.classList.toggle('hidden', !isDark);
        moonIcon.classList.toggle('hidden', isDark);
      }
    })();
  </script>
</th:block>
</html>
