<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Receipts</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Tus tickets de compra</p>
    </div>
    <div class="flex gap-2">
      <a th:href="@{/receipts/upload}"
         class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
        <span th:insert="~{fragments/icons :: upload}" class="w-4 h-4"></span>
        Upload
      </a>
      <form method="post" th:action="@{/receipts/delete-all}" style="display:inline">
        <button type="submit"
                onclick="event.preventDefault(); appConfirm('Delete all receipts?', 'danger').then(ok => { if(ok) this.closest('form').submit(); })"
                class="inline-flex items-center gap-1.5 px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition-colors">
          <span th:insert="~{fragments/icons :: trash}" class="w-4 h-4"></span>
          Delete all
        </button>
      </form>
    </div>
  </div>

  <!-- Search form -->
  <form th:hx-get="@{/receipts/list}"
        hx-target="#receipt-list"
        hx-trigger="submit"
        class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 mb-6 shadow-sm transition-colors">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Store</label>
        <select name="store"
                class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors">
          <option value="">All</option>
          <option th:each="s : ${T(com.sro.myhomebuys.receipts.model.Store).values()}"
                  th:value="${s.name()}"
                  th:text="${s.name()}"
                  th:selected="${store != null && store == s.name()}"></option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">From</label>
        <input type="date" name="date-after" th:value="${dateAfter}"
               class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">To</label>
        <input type="date" name="date-before" th:value="${dateBefore}"
               class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Min total</label>
        <input type="number" step="0.01" name="total-min" th:value="${totalMin}"
               class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors" placeholder="0.00">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Max total</label>
        <input type="number" step="0.01" name="total-max" th:value="${totalMax}"
               class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors" placeholder="0.00">
      </div>
    </div>
    <div class="flex gap-2 mt-4">
      <button type="submit"
              class="inline-flex items-center gap-1.5 px-4 py-2 bg-gray-800 dark:bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-gray-900 dark:hover:bg-indigo-700 transition-colors">
        <span th:insert="~{fragments/icons :: search}" class="w-4 h-4"></span>
        Search
      </button>
      <button type="button"
              onclick="this.form.reset()"
              th:hx-get="@{/receipts/list}"
              hx-target="#receipt-list"
              class="inline-flex items-center gap-1.5 px-4 py-2 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm font-medium rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        Clear
      </button>
    </div>
  </form>

  <!-- Receipt table (HTMX target) -->
  <div id="receipt-list" th:insert="~{receipts/fragments :: table(receipts=${receipts})}"></div>
</th:block>
</html>
