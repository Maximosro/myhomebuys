<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="empty"></th:block>

<th:block th:fragment="table(receipts)">
  <div th:if="${#lists.isEmpty(receipts)}"
       class="text-center py-16 text-gray-400 dark:text-gray-600 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 transition-colors">
    <span th:insert="~{fragments/icons :: search}" class="w-10 h-10 mx-auto mb-3 opacity-50"></span>
    <p class="text-sm">No receipts found.</p>
  </div>

  <div th:if="${!#lists.isEmpty(receipts)}"
       class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm transition-colors">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Store</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Date</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Total</th>
            <th class="px-4 py-3 w-24"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          <tr th:each="r : ${receipts}"
              class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors"
              style="animation: fade-in 0.25s ease-out both;">
            <td class="px-4 py-3">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 flex-shrink-0">
                  <span th:insert="~{fragments/icons :: receipt}" class="w-3.5 h-3.5"></span>
                </div>
                <span class="text-sm font-medium text-gray-900 dark:text-gray-100" th:text="${r.store}">Store</span>
              </div>
            </td>
            <td class="px-4 py-3 text-sm text-gray-600 dark:text-gray-400" th:text="${r.date}">Date</td>
            <td class="px-4 py-3 text-sm text-gray-900 dark:text-gray-100 text-right font-mono font-medium"
                th:text="${#numbers.formatDecimal(r.total, 1, 2, 'COMMA')} + ' €'">Total</td>
            <td class="px-4 py-3 text-right">
              <div class="flex items-center justify-end gap-1">
                <a th:href="@{/receipts/{id}(id=${r.id})}"
                   class="p-1.5 rounded-lg text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                  <span th:insert="~{fragments/icons :: eye}" class="w-4 h-4"></span>
                </a>
                <button th:attr="data-delete-url=@{/receipts/{id}(id=${r.id})}"
                        onclick="event.stopPropagation(); var btn=this; appConfirm('Delete this receipt?', 'danger').then(function(ok) { if(ok) htmx.ajax('DELETE', btn.dataset.deleteUrl, {target: btn.closest('tr'), swap: 'outerHTML'}); })"
                        class="p-1.5 rounded-lg text-gray-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                  <span th:insert="~{fragments/icons :: trash}" class="w-4 h-4"></span>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>

</html>
