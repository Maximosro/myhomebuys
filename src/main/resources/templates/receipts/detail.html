<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="mb-6">
    <a th:href="@{/receipts}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to receipts</a>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900" th:text="${receipt.store}">Store</h1>
        <p class="text-sm text-gray-500 mt-1">
          <span th:text="${receipt.date}">Date</span>
          <span class="mx-2">|</span>
          <span class="font-mono font-medium text-gray-900"
                th:text="${#numbers.formatDecimal(receipt.total, 1, 2, 'COMMA')} + ' €'">Total</span>
        </p>
      </div>
      <form method="post" th:action="@{/receipts/{id}/delete(id=${receipt.id})}">
        <button type="submit"
                onclick="return confirm('Delete this receipt?')"
                class="px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700">
          Delete
        </button>
      </form>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <h2 class="px-4 py-3 text-sm font-semibold text-gray-700 bg-gray-50 border-b border-gray-200">
      Items
    </h2>
    <table class="w-full">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="text-left px-4 py-3 text-xs font-medium text-gray-500 uppercase">Product</th>
          <th class="text-center px-4 py-3 text-xs font-medium text-gray-500 uppercase w-24">Qty</th>
          <th class="text-right px-4 py-3 text-xs font-medium text-gray-500 uppercase w-32">Unit price</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr th:if="${#lists.isEmpty(receipt.items)}">
          <td colspan="3" class="text-center py-8 text-gray-400">No items</td>
        </tr>
        <tr th:each="item : ${receipt.items}" class="hover:bg-gray-50">
          <td class="px-4 py-3 text-sm text-gray-900" th:text="${item.productName}">Product</td>
          <td class="px-4 py-3 text-sm text-gray-600 text-center" th:text="${item.quantity}">1</td>
          <td class="px-4 py-3 text-sm text-gray-900 text-right font-mono"
              th:text="${#numbers.formatDecimal(item.pricePerUnit, 1, 2, 'COMMA')} + ' €'">0.00</td>
        </tr>
      </tbody>
    </table>
  </div>
</th:block>
</html>
