<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="mb-6">
    <a th:href="@{/receipts}"
       class="inline-flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
      <span th:insert="~{fragments/icons :: back}" class="w-4 h-4"></span>
      Back to receipts
    </a>
  </div>

  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-6 mb-6 shadow-sm transition-colors">
    <div class="flex items-start justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 flex-shrink-0">
          <span th:insert="~{fragments/icons :: receipt}" class="w-6 h-6"></span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white" th:text="${receipt.store}">Store</h1>
          <div class="flex items-center gap-3 mt-1 text-sm text-gray-500 dark:text-gray-400">
            <span class="flex items-center gap-1">
              <span th:insert="~{fragments/icons :: calendar}" class="w-3.5 h-3.5"></span>
              <span th:text="${receipt.date}">Date</span>
            </span>
            <span class="text-gray-300 dark:text-gray-600">|</span>
            <span class="font-mono font-semibold text-gray-900 dark:text-white text-base"
                  th:text="${#numbers.formatDecimal(receipt.total, 1, 2, 'COMMA')} + ' €'">Total</span>
          </div>
        </div>
      </div>
      <form method="post" th:action="@{/receipts/{id}/delete(id=${receipt.id})}">
        <button type="submit"
                onclick="event.preventDefault(); appConfirm('Delete this receipt?', 'danger').then(ok => { if(ok) this.closest('form').submit(); })"
                class="inline-flex items-center gap-1.5 px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition-colors">
          <span th:insert="~{fragments/icons :: trash}" class="w-4 h-4"></span>
          Delete
        </button>
      </form>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm transition-colors">
    <div class="px-5 py-3 bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-300">Items</h2>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-800/30 border-b border-gray-200 dark:border-gray-700">
          <tr>
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Product</th>
            <th class="text-center px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider w-20">Qty</th>
            <th class="text-right px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider w-32">Unit price</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          <tr th:if="${#lists.isEmpty(receipt.items)}">
            <td colspan="3" class="text-center py-8 text-gray-400 dark:text-gray-600">No items</td>
          </tr>
          <tr th:each="item : ${receipt.items}"
              class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
            <td class="px-5 py-3 text-sm text-gray-900 dark:text-gray-100" th:text="${item.productName}">Product</td>
            <td class="px-5 py-3 text-sm text-gray-600 dark:text-gray-400 text-center" th:text="${item.quantity}">1</td>
            <td class="px-5 py-3 text-sm text-gray-900 dark:text-gray-100 text-right font-mono"
                th:text="${#numbers.formatDecimal(item.pricePerUnit, 1, 2, 'COMMA')} + ' €'">0.00</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</html>
