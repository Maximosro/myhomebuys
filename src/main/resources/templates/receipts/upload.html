<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="mb-6">
    <a th:href="@{/receipts}"
       class="inline-flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
      <span th:insert="~{fragments/icons :: back}" class="w-4 h-4"></span>
      Back to receipts
    </a>
  </div>

  <div class="max-w-lg">
    <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-1">Upload receipt</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Sube un ticket de compra en PDF</p>

    <div th:if="${error}"
         class="mb-4 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 rounded-xl text-sm">
      <span th:text="${error}"></span>
    </div>

    <form method="post" th:action="@{/receipts}"
          enctype="multipart/form-data"
          class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-6 shadow-sm transition-colors">

      <div class="mb-4">
        <label for="store" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Store</label>
        <select id="store" name="store" required
                class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors">
          <option value="">Select a store...</option>
          <option th:each="s : ${stores}" th:value="${s.name()}" th:text="${s.name()}"></option>
        </select>
      </div>

      <div class="mb-6">
        <label for="file" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Receipt PDF</label>
        <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 text-center hover:border-indigo-400 dark:hover:border-indigo-500 transition-colors cursor-pointer"
             ondragover="this.classList.add('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/10'); event.preventDefault()"
             ondragleave="this.classList.remove('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/10')"
             ondrop="this.classList.remove('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/10');
                     const input = document.getElementById('file');
                     const dt = event.dataTransfer;
                     if (dt.files.length) { input.files = dt.files;
                       document.getElementById('file-name').textContent = dt.files[0].name; }
                     event.preventDefault()">
          <span th:insert="~{fragments/icons :: upload}" class="w-8 h-8 mx-auto mb-2 text-gray-400 dark:text-gray-500"></span>
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-1">Arrastra tu PDF aquí o</p>
          <label for="file"
                 class="inline-flex items-center gap-1 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 cursor-pointer transition-colors">
            Seleccionar archivo
          </label>
          <p id="file-name" class="text-xs text-gray-500 dark:text-gray-400 mt-2"></p>
        </div>
        <input type="file" id="file" name="file" accept=".pdf" required
               class="hidden"
               onchange="document.getElementById('file-name').textContent = this.files[0]?.name || ''">
      </div>

      <button type="submit"
              class="w-full py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
        <span th:insert="~{fragments/icons :: upload}" class="w-4 h-4"></span>
        Upload receipt
      </button>
    </form>
  </div>
</th:block>
</html>
