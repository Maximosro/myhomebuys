<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="mb-6">
    <a th:href="@{/receipts}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to receipts</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-900 mb-6">Upload receipt</h1>

  <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
    <span th:text="${error}"></span>
  </div>

  <form method="post" th:action="@{/receipts}"
        enctype="multipart/form-data"
        class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-lg">
    <div class="mb-4">
      <label for="store" class="block text-sm font-medium text-gray-700 mb-1">Store</label>
      <select id="store" name="store" required
              class="w-full border border-gray-300 rounded-md px-3 py-2">
        <option value="">Select a store...</option>
        <option th:each="s : ${stores}" th:value="${s.name()}" th:text="${s.name()}"></option>
      </select>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Receipt PDF</label>
      <label for="file" class="block w-full cursor-pointer">
        <div class="flex items-center gap-3 px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg hover:border-blue-400 hover:bg-blue-50/30 transition-colors">
          <span class="inline-flex px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shrink-0">
            Browse...
          </span>
          <span id="file-name" class="text-sm text-gray-500 truncate">No file selected</span>
        </div>
        <input type="file" id="file" name="file" accept=".pdf" required class="sr-only"
               onchange="document.getElementById('file-name').textContent = this.files[0]?.name || 'No file selected'">
      </label>
    </div>

    <button type="submit"
            class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">
      Upload
    </button>
  </form>
</th:block>
</html>
