<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<th:block th:fragment="content">
  <div class="mb-6">
    <a th:href="@{/receipts}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to receipts</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-900 mb-6">Upload receipt</h1>

  <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
    <span th:text="${error}"></span>
  </div>

  <form method="post" th:action="@{/receipts}"
        enctype="multipart/form-data"
        class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-lg">
    <div class="mb-4">
      <label for="store" class="block text-sm font-medium text-gray-700 mb-1">Store</label>
      <select id="store" name="store" required
              class="w-full border border-gray-300 rounded-md px-3 py-2">
        <option value="">Select a store...</option>
        <option th:each="s : ${stores}" th:value="${s.name()}" th:text="${s.name()}"></option>
      </select>
    </div>

    <div class="mb-6">
      <label for="file" class="block text-sm font-medium text-gray-700 mb-1">Receipt PDF</label>
      <input type="file" id="file" name="file" accept=".pdf" required
             class="block w-full text-sm text-gray-700
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-medium
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100
                    file:cursor-pointer cursor-pointer
                    border border-gray-300 rounded-md p-2">
    </div>

    <button type="submit"
            class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">
      Upload
    </button>
  </form>
</th:block>
</html>
